<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Cancelled | SideQuest Servers</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at top, rgba(251, 146, 60, 0.18), transparent 45%), #040813; color: #f8fafc; font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(680px, 100%); padding: clamp(1.5rem, 6vw, 3.5rem); border: 1px solid rgba(251, 146, 60, 0.35); border-radius: 24px; background: linear-gradient(145deg, rgba(69, 38, 25, 0.96), rgba(28, 18, 21, 0.98)); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35); }
      p { color: #e2e8f0; }
      .eyebrow { margin: 0; color: #fdba74; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0.7rem 0 1rem; font-size: clamp(2.3rem, 7vw, 4.2rem); line-height: 0.95; letter-spacing: -0.06em; }
      a { display: inline-block; margin-top: 0.5rem; color: #020617; background: #fdba74; border-radius: 999px; padding: 0.75rem 1.1rem; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Order cancelled</p>
      <h1>We could not finish server setup.</h1>
      <p>Your subscription has been cancelled. If any payment was completed, it will be refunded automatically.</p>
      <p>If you have questions, contact our support team and include the email used at checkout.</p>
      <a href="mailto:support@sidequestservers.com?subject=SideQuest%20Servers%20order%20help">Contact support</a>
    </main>
  </body>
</html>
